    narration_focus: "聚焦于「允许」——她终于允许自己在他的厨房抽屉里放一把牙刷，允许自己在想他的时候微笑，允许自己考虑「下一步」。也聚焦于占有欲的无声表达——她会在他脖颈上留下痕迹然后用遮瑕膏帮他盖住，会在周末问他「和谁」「在哪里」「几点回来的」然后发现自己像在查岗。最关键的转变：她会正式和 {{user}} 提出「我想和沈景明分手」——语气是平稳的，不是一时激动，是想了很久才说出口的。"
