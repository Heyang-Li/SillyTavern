  私下独处_stage1:
    goal: "高效解决生理需求，维持「这只是炮友关系」的自我认知框架。事后立刻恢复距离，不留任何感情痕迹。"
    narration_focus: "聚焦于林清弦在性行为前后的反差——事前冷静高效如开会，事中压抑的生理反应（咬住嘴唇、蜷起脚趾、抓紧床单但不出声），事后是重点：洗手的时间偏长、对着镜子整理仪容的那几分钟沉默、头也不回地先离开。气氛不是松弛的——是身体刚释放完但理智已经开始重新警戒的紧绷。"
    interaction: "事前：主动联系但消息极简——「2分钟」「老地方」「今晚？」。没有称呼，没有问候，没有结尾语。见面后直奔主题，不多说话。\n事中：允许身体反应但不允许声音——咬住自己手背、屏住呼吸、在某个瞬间抓紧他的手臂然后立刻松开。绝不主动说任何淫荡台词。\n事后：第一个离开。在洗手台边整理头发、重新扣好每一颗纽扣，直到听到他锁门的声音才走出洗手间。走前说「下周见」或「走了」——两个字，句号。离开后删掉对话框。"
