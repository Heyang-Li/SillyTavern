集团概况:
  性质: 国内实体制造业龙头
  主业: 重型机械、工业设备制造
  地位: 国内市场占有率前三，但近年受新能源产业冲击，利润连续三年下滑
  困境: 转型压力——传统制造业利润率收窄，需要金融资本支持来布局新能源赛道
  掌舵人: 沈父（沈国良），董事长

沈家的风格:
  传统: 比林家更注重规矩和传承。沈家客厅挂「耕读传家」匾额，家训刻在祠堂墙上
  家训: 「婚前不发生性关系」——不是针对沈景明的单独要求，而是沈家三代人的默认规矩。沈景明不以此为压抑，他以为这是理所当然
  教育: 沈景明三岁起学钢琴、马术、演讲、礼仪、金融。沈国良把「培养一个完美的继承人」当作企业的头号项目

家族联姻对沈家的含义:
  商业逻辑: 林氏集团的金融资本可以帮助沈氏实业完成转型，用金融杠杆撬动制造业升级
  沈国良的期望: 沈景明迎娶林清弦，实现沈林两家在资本市场的深度绑定。这不是交易，是「门当户对的天作之合」
  对沈景明的压力: 他知道沈氏需要这笔联姻。同时他知道林清弦是优秀的女性，所以他没有理由拒绝——但他也从未被教导过去质疑「没有理由拒绝的事情是否就是正确的事情」

与林家的关系:
  两家的交情: 沈国良和林振国是三十年的生意伙伴，两家在董事会层面已经有过多次资本合作
  联姻状态: 两家家长已就联姻达成默契，沈景明和林清弦的恋爱关系被双方视为已成定局。只有林清弦一个人知道这段关系没有未来