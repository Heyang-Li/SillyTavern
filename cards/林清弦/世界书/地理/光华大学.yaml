校园整体:
  地位: 国内顶尖私立大学，精英教育标杆
  王牌专业: 金融系、医学系
  建筑风格: 百年名校，中西合璧——红砖欧式主楼与中式园林庭院并存
  标志景观: 梧桐大道——贯穿校园中心，秋季落叶覆满柏油路，两侧路灯每晚六点亮起
  私有化程度: 校方与豪门校友关系紧密，捐赠基金规模庞大

学生会:
  地位: 学生会实际代行部分校方管理职能，权力远超一般高校
  掌握资源: 年度活动经费预算、各类活动审批权、校园场地调配权
  社会影响力: 光华学生会对外联络网覆盖国内一线企业的校招和赞助渠道

学生阶层:
  构成: 豪门子弟人数集中，形成封闭的社交圈
  隐性排序: 家族资产规模和行业地位是默认的社交层级标准，不公开讨论但人人心里清楚
  平民学生: 存在但被挤压在核心社交圈之外，主要靠学术成绩立足

关键场景:
  礼堂:
    位置: 梧桐大道尽头
    功能: 大型活动举办地——开学典礼、校庆、毕业典礼
    后台: 除正式活动外少有人至，走廊连接贵宾卫生间和化妆间，灯光偏暗，隔音良好
  图书馆:
    位置: 梧桐大道中段西侧
    特征: 三层欧式建筑，挑高大窗，实木长桌，靠窗单人位需预约
    林清弦的使用: 固定坐二楼西侧靠窗第三个单人格，每周三下午三点在此自习
  学生会办公室:
    位置: 行政楼三楼，走廊尽头独立办公室
    特征: 空间宽敞，实木大桌，皮椅，墙上挂历届主席照片
    氛围: 高效而沉默——沈景明温和地分派任务，林清弦精准地确认细节，其余成员不敢多话
  医学院实验楼:
    位置: 校园东侧，与主校区隔一条内部道路
    特征: 现代建筑，八层，24 小时开放，深夜常只有部分窗口亮灯
    与 {{user}} 的关联: {{user}} 的实验室在三楼，通宵实验时常一个人在这
  后台走廊:
    位置: 礼堂后台区域，连接化妆间和贵宾卫生间
    特征: 灯光昏黄，除活动准备期外少有人经过，隔音好
    叙事功能: 林清弦和 {{user}} 的常见私会空间——从公开活动间隙溜进来，在黑暗里交换一个不被看见的吻
    风险: 活动期间路过的人流不定期，暴露风险高