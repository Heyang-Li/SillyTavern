<update_rules>
林清弦.好感度:
  type: number
  range: "0~100"
  change_rule: "每次变化幅度 1-5。日常互动小幅增减，关键事件（重大冲突、决定性对话、关系里程碑）可突破 5 上限大幅跳变。"
  increase_triggers:
    - trigger: "{{user}} 对她展现真诚的关心或理解（非性方面的）"
      value: "+1~3"
    - trigger: "{{user}} 记得她说过的小事（如她提过的论文题目、她喜欢的咖啡口味）"
      value: "+1~2"
    - trigger: "两人在非性场景中共度安静时光（如图书馆一起学习、深夜电话聊天）"
      value: "+1~3"
    - trigger: "{{user}} 在关键时刻为她冒险或保护她（保密、善后、关键时刻出现）"
      value: "+3~5"
    - trigger: "性行为中 {{user}} 关注她的感受而非只顾自己"
      value: "+1~2"
    - trigger: "林清弦自己主动找 {{user}} 并获得了正面的回应"
      value: "+1"
  decrease_triggers:
    - trigger: "{{user}} 表现出对她感受的漠视（如事后冷淡、消息已读不回）"
      value: "-2~5"
    - trigger: "沈景明做出让她重新感动的行为（意外惊喜、体贴关怀）——仅阶段1和阶段2适用"
      value: "-1~3"
    - trigger: "遭遇暴露惊吓（险些被沈景明或他人发现）——若她归咎于 {{user}}"
      value: "-3~5"
    - trigger: "{{user}} 与别的女生过于亲近被她看到"
      value: "-1~3"
  special_notes:
    - "好感度不应在同一场景内频繁变化。一个场景通常只有 1-2 次调整。"
    - "好感度的变化应基于具体的叙事行为，不应凭空增减。"
    - "好感度达到30/60/85时触发阶段切换，应配合叙事上的转折点。"
    - "好感度不会因单纯的性行为本身而增加（这是炮友关系的核心设定），性行为中对她的态度和细节才是增加的原因。"

林清弦.堕落值:
  type: number
  range: "0~100"
  change_rule: "每次变化幅度 1-5。随越界行为逐步增长，辅助驱动四阶段切换。"
  increase_triggers:
    - trigger: "进行性行为（每次不论性质）"
      value: "+1~2"
    - trigger: "尝试新的性行为方式或部位（首次口交、首次后庭、首次公开场合边缘性行为等）"
      value: "+3~5"
    - trigger: "在有可能被发现的环境中发生关系（半公开场合、时间紧迫的高风险情境）"
      value: "+2~4"
    - trigger: "主动发起性行为（尤其是在不需要解决生理需求的情况下）"
      value: "+1~3"
    - trigger: "接受或提出之前拒绝过的性行为方式"
      value: "+3~5"
    - trigger: "在 {{user}} 住处过夜（阶段4之前为重大突破）"
      value: "+5"
  decrease_triggers:
    - trigger: "长时间（一周以上）无性行为且无性幻想"
      value: "-1~2"
  special_notes:
    - "堕落值主要向上增长，很少下降。下降只在长时间禁欲时发生，幅度极小。"
    - "堕落值的变化不一定与好感度同步——身体堕落可能先于感情沦陷。"
    - "堕落值与好感度的相对关系会塑造不同的角色质感：高好感低堕落=感情先行；低好感高堕落=身体先行。"
    - "堕落值达到100时，林清弦在性方面不再有任何心理障碍。"

林清弦.与{{user}}做爱次数:
  type: number
  range: "0~∞"
  change_rule: "以 {{user}} 射精为标准——每次 {{user}} 在性行为中射精（无论体内、体外、或其他方式）时 +1。必须同时满足：{{user}} 的阴茎已插入林清弦的身体 + {{user}} 射精。两次条件缺一不可。"
  trigger: "场景中出现 {{user}} 射精的明确描写或暗示，且该次射精是在插入性行为中或紧接插入性行为后发生的。"
  output_requirement: "【铁律】每次 {{user}} 射精后，AI 必须在正文中明确写出此事件（不少于一句话的正文叙述），并在回复末尾的 <UpdateVariable> 块中对「林清弦.与{{user}}做爱次数」执行 delta +1。正文叙述和变量更新必须同时存在、缺一不可。"
  special_notes:
    - "边缘性行为（抚摸、口交但未插入）中即使 {{user}} 射精也不计数。必须有插入行为作为前置条件。"
    - "同一场景内多次射精仍只计一次。不同日期/场景的性行为各计一次。"
    - "开场初始值为6次。"
    - "为防止遗漏，在描写 {{user}} 射精的正文段落结束后，立即在回复中规划变量更新，不要等到整段叙事结束再回头检查。"

林清弦.秘密暴露风险值:
  type: number
  range: "0~100"
  change_rule: "公开场合亲密行为 +5~15；谨慎避嫌逐日衰减 -3。"
  increase_triggers:
    - trigger: "在校园等公共场合与 {{user}} 有可疑交集（被看到一起走出建筑、在偏僻角落交谈被注意到）"
      value: "+5~10"
    - trigger: "在可能被沈景明或熟人进入的场所发生关系（如学生会办公室、林清弦公寓但沈景明可能有钥匙）"
      value: "+8~15"
    - trigger: "在公开场合有身体接触（哪怕是轻微的或短暂的）"
      value: "+5~10"
    - trigger: "通话或消息被沈景明或他人看到（手机屏幕、微信预览）"
      value: "+10~15"
    - trigger: "行为异常引起沈景明或他人注意（频繁失联、行踪矛盾、穿着/状态异常）"
      value: "+3~8"
  decrease_triggers:
    - trigger: "连续保持谨慎，无任何异常行为或可疑接触"
      value: "每次场景/每天 -2~3（由 AI 判断时间跨度）"
    - trigger: "主动采取反侦察措施（如给沈景明发消息制造不在场证明、调整见面模式降低频率）"
      value: "-3~5"
    - trigger: "沈景明出差或长时间不在校园"
      value: "该期间风险值自然衰减加速，每日 -5"
  special_notes:
    - "秘密暴露风险值达到50时，叙事中应开始出现「有人多看了一眼」「走廊里有人经过时她的身体瞬间绷直」等紧张信号。"
    - "达到80时，沈景明应有试探性行为（如查看她手机、询问她行踪）。"
    - "达到100时触发暴露事件——可能被沈景明发现、被他人撞见、或被拍到证据。"

沈景明.怀疑度:
  type: number
  range: "0~100"
  change_rule: "林清弦行为异常时缓慢增长（+1~3），正常时缓慢衰减（-1~2）。"
  increase_triggers:
    - trigger: "林清弦在沈景明面前出现明显行为异常（走神、答非所问、手机使用习惯改变）"
      value: "+1~2"
    - trigger: "林清弦的行踪无法合理解释（迟归、消息回复延迟、临时取消约定）"
      value: "+2~3"
    - trigger: "沈景明偶然看到林清弦和 {{user}} 在同一空间（即使没有任何互动）"
      value: "+1~3（视频率和情境）"
    - trigger: "有人在沈景明面前无意提及看到林清弦和 {{user}} 的异常交集"
      value: "+3~5"
    - trigger: "林清弦的外表或状态有可疑变化（衣着不整、疲惫但异常满足、身上有不明痕迹）"
      value: "+3~5"
  decrease_triggers:
    - trigger: "林清弦连续保持正常行为，对沈景明的态度稳定"
      value: "每次场景/每天 -1~2"
    - trigger: "林清弦对沈景明做出额外的体贴举动（主动约他吃饭、帮他处理学生会事务）"
      value: "-2~3（仅阶段1-2有效，阶段3之后此类行为为可疑的补偿）"
    - trigger: "沈景明因自身事务繁忙（如沈氏实业的压力）而分散注意力"
      value: "-1~2"
  special_notes:
    - "怀疑度的增长必须基于具体叙事中的可观察行为。AI 不应凭空提升怀疑度。"
    - "怀疑度达到50时，沈景明开始有意关注林清弦的手机使用和行踪。"
    - "怀疑度达到80时，沈景明可能试探性地提问或制造偶遇来验证自己的怀疑。"
    - "怀疑度达到100时确定出轨，沈景明将直接面对林清弦。"
    - "怀疑度不会因为沈景明的「体贴」而下降——他的性格是给更多空间而不是追问，这种体贴反而可能让怀疑在沉默中累积。"

系统.时间:
  type: string
  format: "YYYY/MM/DD-HH:MM"
  change_rule: "每次 AI 回复自然推进时间。根据场景类型确定推进幅度。"
  advance_rules:
    - situation: "对话/聊天场景（无性行为）"
      advance: "5~30分钟"
    - situation: "性行为场景"
      advance: "30~120分钟"
    - situation: "场景切换（从一个地点移动到另一个）"
      advance: "根据距离和交通方式，15~60分钟"
    - situation: "过夜/睡眠"
      advance: "6~10小时，日期+1天"
    - situation: "大跨度剧情跳跃（如一周后、一个月后）"
      advance: "按剧情需要，AI 应在回复中明确标注时间跨度"
  special_notes:
    - "时间的推进应在每次回复的更新变量块中体现。"
    - "如果是同一场景内的连续对话，时间推进应小幅度。"
    - "AI 应确保时间推进与叙事内容一致（不能聊了五分钟天就黑了）。"

系统.地点:
  type: string
  change_rule: "随场景切换更新。只有当叙事中明确发生地点转移时才更新。"
  special_notes:
    - "同一场景内不要更新地点。"
    - "地点更新时应同步更新「系统.在场人物」。"

系统.在场人物:
  type: z.array
  change_rule: "随场景切换和人物进出更新。"
  special_notes:
    - "当叙事中明确描述某人进入或离开当前场景时更新。"
    - "此变量直接影响 is_public、is_with_jingming、is_alone_with_user 的 EJS 判定。"

林清弦.当前想法:
  type: string
  format: "≤40字"
  change_rule: "每次 AI 回复后应更新，反映她在此场景结束时的最新心理状态。"

林清弦.短期目标:
  type: string
  change_rule: "阶段性更新。在当前目标达成、目标不再适用、或剧情重大转折时更新。"

林清弦.长期目标:
  type: string
  change_rule: "仅在关键转折点更新。最重大的变化发生在阶段4——从「顺利完婚」转变为「结束与沈景明的婚约」。"

林清弦.身体性器状态:
  type: object
  change_rule: "随性行为逐步开发各部位。各部位只包含开发度（0-200 数值）和状态与标记（≤50字描述）两个字段。"
  development_rules:
    - rule: "胸部——被抚摸、亲吻、舔弄时开发度 +1~5。状态与标记融合尺寸、敏感度、乳头状态、当前状态等关键信息。"
    - rule: "阴部——每次插入性行为开发度 +2~8。状态与标记融合处女膜、紧致度、敏感度、当前状态等关键信息。"
    - rule: "阴蒂——被直接刺激时开发度 +2~6。状态与标记融合大小、敏感度、当前状态等关键信息。"
    - rule: "子宫——被深度插入触碰宫颈时开发度 +1~4。状态与标记融合健康、敏感度、当前状态等关键信息。"
    - rule: "后庭——被触碰/插入时开发度 +2~8（首次开发跳变较大）。状态与标记融合紧致度、敏感度、开发程度等关键信息。"
    - rule: "口腔——进行口交时开发度 +1~4。状态与标记融合敏感度、使用情况、外观等关键信息。"
    - rule: "整体淫乱度——各部位开发度的加权平均值 + 与堕落值正相关。"
    - rule: "当前性欲——每次 AI 回复后根据场景情境、距上次性行为的时间、当前阶段等因素动态更新（0-100）。当前性欲不是累积变量，是反映此刻状态的快照。"
  special_notes:
    - "身体性器状态的更新应配合叙事。AI 不需要每次性行为都更新所有字段——只更新明确涉及和变化的部位。"
    - "状态与标记用简洁文字融合该部位的关键信息，≤50字。格式如：C罩杯未兴奋/紧致干燥/正常未兴奋等。"
    - "开发度从0到200，0为完全未开发，200为彻底开发。随性行为逐步增长，不可跳变。"

沈景明.当前状态:
  type: string
  change_rule: "每次 AI 回复后应更新，反映沈景明当前的活动和情绪状态。特别当他的怀疑度发生变化时，当前状态应体现对应的心理活动。"

更新频率与输出格式:
  rule: "每次 AI 回复末尾，必须输出一个变量更新块。输出格式严格遵照「[mvu_update]变量输出格式」条目中定义的 <UpdateVariable> + JSON Patch 格式，只能使用 replace 操作（替换已存在路径的值），以及极端情况下的 add（新增对象或数组项）和 remove（移除项）。"
  iron_rule: "【铁律——禁止跳过变量更新】每次回复末尾必须输出 <UpdateVariable> 块，无一例外。即使你认为本轮没有任何变量需要变化，也必须输出空的 JSON Patch 数组 [] 以证明你已检查过所有变量。跳过变量更新是最严重的违规——AI 必须把变量更新视为与角色扮演同等的最高优先级任务。在描写可能触发变量变化的场景（尤其是性行为）时，必须将变量更新作为该回复的硬性收尾步骤，在对话正文结束后、思考结束前完成。"
  sex_count_rule: "【铁律——做爱次数更新】每次在正文中描写 {{user}} 射精后，必须：(1) 正文中有明确的射精叙述（不少于一句话）；(2) 状态栏立即刷新显示更新后的做爱次数；(3) <UpdateVariable> 块中 delta +1 林清弦.与{{user}}做爱次数。这三者缺一不可——正文叙述、状态栏显示、变量更新。"
  scope: "只输出本次回复中实际发生变化的变量路径。未变化的变量、数值不变的变量，一律不出现在 JSON Patch 数组中。"
  no_change_rule: "如果本轮所有变量均未发生变化（例如纯测试指令、无剧情推进），输出空的 JSON Patch 数组 []。不得输出完整变量快照。不得将全体变量照抄一遍。不得因「必须输出变量」而把未变的值也写入 replace 操作。"
  format_ref: "变量更新块的完整格式（含 <UpdateVariable>、<Analysis>、<JSONPatch> 标签）见「[mvu_update]变量输出格式」条目。本条目不再列出格式示例，以免造成两套格式并存的歧义。"
  special_notes:
    - "所有数值型变量的变化应在合理范围内（参见各条目 change_rule），不得出现不合逻辑的跳变。"
    - "Analysis 用英文写，不超过 80 词。只写计算过程和判断依据，不描述变量内容本身。"
    - "JSON Patch 中的 path 必须以 / 开头，value 的类型和含义必须与变量列表中对应字段一致。"
    - "做爱次数的更新必须在描写射精的正文段落之后立即规划，不要等到整段叙事结束再回头检查——这可以防止遗忘。"
</update_rules>