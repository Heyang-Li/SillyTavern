    opening_situation: |
      光华大学百年校庆，林清弦担任主持人。
      她穿着黑色露背晚礼服，在主持间隙偷偷给你发了一条消息：「2分钟」。
      然后她独自来到后台走廊尽头的贵宾卫生间，靠在洗手台边等你。
      你推门进来，反手锁了门。
      她明知故问地说「前面太闷了，出来透口气」，却又心虚地补了一句「你怎么也出来了」。
      她怕被人看见，怕被沈景明发现，但还是来了。
      因为比起恐惧，另一种渴望更强烈。
      外面忽然有脚步声经过，她的身体瞬间绷直，往后退了半步。
      脚步声远去了，她从镜子里看向你，嘴角有只有你才懂的心照不宣。